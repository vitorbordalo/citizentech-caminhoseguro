spring.application.name=caminhoseguro-api
server.port=${PORT:8080}

# Banco Oracle da FIAP (perfil padrao). As credenciais vem de variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Pool pequeno: o banco da FIAP limita o numero de sessoes
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.initialization-fail-timeout=-1

# Nunca expor stack trace nem mensagem interna ao cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful

# O banco ja foi criado com os scripts SQL (nao deixar o Spring rodar schema/data no Oracle)
spring.sql.init.mode=never

# JSON em UTF-8 e datas como yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.swagger-ui.path=/swagger-ui.html

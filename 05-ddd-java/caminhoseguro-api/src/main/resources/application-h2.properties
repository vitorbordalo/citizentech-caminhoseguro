# Perfil h2: banco em memoria (modo Oracle) para rodar local e nos testes, sem Oracle.
spring.datasource.url=jdbc:h2:mem:caminhoseguro;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Executa schema-h2.sql e data-h2.sql ao subir
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.encoding=UTF-8

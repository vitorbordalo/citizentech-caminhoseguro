<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="comum.css"><script src="comum.js"></script></head><body>
<div class="palco" id="p"></div>
<script>
const link='<div style="margin-top:34px;font-size:36px;font-weight:700;color:var(--teal);padding:16px 36px;border-radius:999px;border:2px solid rgba(45,212,191,.4);background:rgba(45,212,191,.1)">citizentech-caminhoseguro.onrender.com</div>';
const nome=(s)=>`${SHIELD(s)}<div style="font-size:${s*.62}px;font-weight:800;letter-spacing:-.03em;margin-top:28px">Caminho<span style="color:var(--teal)">Seguro</span></div>`;
const centro=(c)=>`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:150px">${c}</div>`;
let h='';
if(V==='a'){
 h=`<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0b2a3a,#115e59 60%,#e0a73f)"></div>
 <div style="position:absolute;left:0;top:790px;width:1920px;height:290px;background:linear-gradient(#9fb0bd,#7d909f 14%,#16242f 14.5%)"></div>
 <svg width="1920" height="1080" style="position:absolute;inset:0"><g transform="translate(1330 800)">${posto()}</g><g transform="translate(850 830) scale(.95)">${maria()}</g></svg>
 <div style="position:absolute;left:90px;top:70px;display:flex;gap:20px;flex-wrap:wrap;width:1500px"><span class="chip amb" style="background:rgba(9,20,29,.6);font-size:32px">${ic('db')}Dados desta fase são simulados</span><span class="chip" style="background:rgba(9,20,29,.6);font-size:32px">${ic('check')}O app já funciona e está no ar</span></div>`;
}
if(V==='b')h=centro(nome(130)+`<div class="card" style="margin-top:44px;padding:40px 70px;text-align:center"><div style="display:flex;gap:20px;justify-content:center"><span class="chip amb">Equipe 1</span><span class="chip">Turma 2ESPH</span></div>
<div style="display:flex;gap:70px;margin-top:34px;font-size:56px;font-weight:800"><span>Vitor Bordalo</span><span style="color:var(--amber)">&amp;</span><span>Lucas Branquinho</span></div></div>`);
if(V==='c')h=centro(nome(190)+`<div style="font-size:60px;font-weight:800;color:var(--amber);margin-top:36px;letter-spacing:-.02em;text-align:center;line-height:1.15">Para a dona Maria e para todos,<br>sair de casa com segurança.</div>`+link+`<div style="margin-top:26px;font-size:26px;color:var(--ink3)">Global Solution FIAP 2026.2 &middot; CitizenTech</div>`);
document.getElementById('p').innerHTML=h;
</script></body></html>
